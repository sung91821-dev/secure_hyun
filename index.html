<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정보보안기사 실기 키워드 암기노트</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1d1d1b;--mute:#6b6a65;--line:#e4e2db;--acc:#b4432b;--accbg:#fbeee9;--code:#f1efe8;--hi:#fff3c4}
@media (prefers-color-scheme:dark){:root{--bg:#18181a;--card:#222225;--ink:#ecebe6;--mute:#9a9992;--line:#34343a;--acc:#f08a6f;--accbg:#3a2621;--code:#2c2c31;--hi:#4a4120}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 12px 8px}
h1{font-size:17px;margin:0 0 8px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tools{display:flex;gap:6px;align-items:center}
.tools input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 10px;font-size:15px}
.tg{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 9px;font-size:13px}
.tg.on{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
main{padding:10px 12px 60px;max-width:760px;margin:0 auto}
.legend{font-size:12.5px;color:var(--mute);margin:2px 0 10px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 12px;overflow:hidden}
section h2{font-size:15px;margin:0;padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
section h2 small{color:var(--mute);font-weight:400}
.it{padding:8px 12px;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.k{font-weight:700}
.k .s{color:var(--acc);margin-right:3px}
.d{color:var(--ink);opacity:.86;font-size:14px;margin-top:1px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--code);border-radius:4px;padding:1px 4px;word-break:break-all}
.done{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px;font-weight:400}
body.quiz .d{filter:blur(6px);cursor:pointer;user-select:none}
body.quiz .d.show{filter:none}
.empty{color:var(--mute);text-align:center;padding:30px 0}
mark{background:var(--hi);color:inherit}
.mb{margin-top:5px;border:1px solid var(--line);background:var(--card);color:var(--acc);border-radius:6px;padding:3px 8px;font-size:12.5px;font-weight:600}
.mb.on{background:var(--accbg);border-color:var(--acc)}
.toc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 12px}
.toc h3{font-size:14px;margin:8px 0 4px;color:var(--acc)}
.toc h3:first-child{margin-top:0}
.toc a{display:flex;justify-content:space-between;gap:8px;color:var(--ink);text-decoration:none;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}
.toc .tgrp{font-size:12px;font-weight:700;color:var(--mute);margin:8px 0 0;padding:2px 0;letter-spacing:.02em}
.toc a small{color:var(--mute)}
section{scroll-margin-top:150px}
.tag{font-size:11px;font-weight:600;border-radius:4px;padding:0 5px;margin-left:5px;vertical-align:1px;background:var(--code);color:var(--mute)}
.tag.t단,.tag.t서{background:var(--accbg);color:var(--acc)}
.m{margin-top:5px;padding:7px 9px;border-left:3px solid var(--acc);background:var(--accbg);border-radius:0 6px 6px 0;font-size:14px}
.memo{display:block;margin-top:4px;padding:8px 10px;background:var(--hi);border-left:3px solid var(--acc);border-radius:0 6px 6px 0;line-height:1.65}
.toc a.hot{display:block;background:var(--hi);border:1px solid var(--acc);border-radius:8px;padding:8px 10px;margin:0 0 10px;font-weight:700;color:var(--ink)}
.toc a.hot small{display:block;font-weight:400;margin-top:2px}
</style>
</head>

<header>
  <h1>정보보안기사 실기 · 키워드 암기노트</h1>

  <div class="tabs" id="tabs"></div>
  <div class="tools">
    <input id="q" type="search" placeholder="검색 (예: SetUID, 72시간)">
    <button class="tg" id="star">★만</button>
    <button class="tg" id="atk">🛡공격</button>
    <button class="tg" id="gc">기출</button>
    <button class="tg" id="quiz">가리기</button>
  </div>
</header>

  <div class="legend">★ = 기출 반복 출제 항목 · <b>가리기</b>를 켜면 정의가 흐려지고, 탭하면 보입니다 · <b>🛡 방어 방법</b>을 누르면 대응책이 펼쳐집니다 · <b>🛡공격</b>은 공격 항목만 보기 · <span class="done">채팅에서 다룸</span> = 이미 공부한 주제 · <b>목차</b> 탭에서 섹션을 누르면 바로 이동 · 기출·추가 공격 항목은 목차의 해당 섹션 끝에 합침(<span class="tag t단">단답 기출</span> <span class="tag t서">서술 기출</span> = 1~28회 실기, <span class="tag">최근 공격</span>) · <b>기출</b> = 기출 항목만 보기</div>
  <div id="out"></div>
</main>

[1, "SPF 레코드 · 결과", "<code>example.com. TXT \"v=spf1 ip4:203.0.113.10 include:_spf.google.com -all\"</code> · <code>-all</code> 목록 외 <b>fail</b>(거부) · <code>~all</code> <b>softfail</b>(의심 표시) · 결과 pass · fail · softfail · neutral · none(SPF 없음) · 헤더 <code>Received-SPF: pass (... designates 203.0.113.10 as permitted sender) client-ip=203.0.113.10</code> <span class='done'>채팅에서 다룸</span>"],
[1, "DKIM 헤더 (RSA)", "메일서버 로그의 \"RSA\" = DKIM 서명 알고리즘 · <code>DKIM-Signature: v=1; a=rsa-sha256; d=example.com; s=selector1; h=from:to:subject:date; bh=본문해시; b=서명값</code> · <code>a=</code> RSA 서명+SHA-256 · <code>d=</code> 서명 도메인 · <code>s=</code> 셀렉터 · <code>h=</code> 서명한 헤더 · 공개키 <code>selector1._domainkey.example.com TXT \"v=DKIM1; k=rsa; p=MIIB...\"</code> · 송신 서버 <b>개인키로 서명</b>, 수신 서버 <b>DNS 공개키로 검증</b> → 도메인 인증 + 무결성 <span class='done'>채팅에서 다룸</span>"],
[1, "DMARC 레코드", "<code>_dmarc.example.com TXT \"v=DMARC1; p=reject; rua=mailto:dmarc@example.com\"</code> · <code>p=none</code> 모니터링만 · <code>quarantine</code> 스팸함 · <code>reject</code> 거부 · <code>rua</code> 리포트 수신 주소 · From 도메인과 SPF·DKIM 도메인 <b>일치(alignment)</b>까지 확인 · 단독으로는 인증 못 함 <span class='done'>채팅에서 다룸</span>"],
[1, "Authentication-Results 해석", "정상 <code>spf=pass smtp.mailfrom=example.com; dkim=pass header.d=example.com header.s=selector1; dmarc=pass (p=REJECT)</code> · 위조 <code>Received-SPF: fail ... client-ip=198.51.100.66</code> + <code>spf=fail; dkim=none (no signature); dmarc=fail</code> → <b>발신자 위조(스푸핑)·피싱</b> · 서명 있는데 내용 변조 <code>dkim=fail (body hash did not verify)</code> <span class='done'>채팅에서 다룸</span>"],

[1, "메일 헤더 확인 위치", "SPF·DKIM 검증 결과는 <b>받은 메일함</b>에만(<b>수신 MTA</b>가 검증하고 헤더에 기록) · 보낸메일함엔 송신 서버가 붙인 DKIM-Signature 서명값만, 결과는 없음 · Gmail ⋮ → 원본 보기(SPF/DKIM/DMARC 요약) · 네이버 더보기 → 원문 보기 · Outlook 파일 → 속성 → 인터넷 헤더 · 스팸함 원본에서 fail 실사례 <span class='done'>채팅에서 다룸</span>"],
[1, "SPF vs DKIM (서버 vs 도메인)", "<b>SPF</b> = 보낸 <b>서버 IP</b>가 도메인의 허용 목록에 있나(등록 직원만 출입) · <b>DKIM</b> = 그 <b>도메인의 키로 서명</b>했나(회사 직인), 어느 서버에서 보냈든 OK · 예) Gmail이 LinkedIn 메일의 <code>d=linkedin.com</code> 서명을 검증 · 도메인(linkedin.com) ⊃ 서버(메일서버 A·B·발송업체) · 변조 탐지·포워딩 유지는 DKIM만 O · DKIM pass = 'd= 도메인 키로 서명됨'이지 From 주소 보증 X → From과 d= 일치는 DMARC · 답안: SPF는 발신 서버 IP를, DKIM은 전자서명으로 발신 도메인과 무결성을 검증 <span class='done'>채팅에서 다룸</span>"],
[1, "SPF와 스팸", "SPF는 <b>발신자 위조(스푸핑) 방지</b> 기술이지 스팸 판별 X · 남의 도메인(bank.com) 사칭은 fail로 걸러짐 · 스패머가 <b>자기 도메인</b>에 SPF 등록하면 pass · SPF 없는 도메인은 none · 실제 스팸 차단: <b>RBL/DNSBL</b>(스팸 IP 블랙리스트, 단골) · SpamAssassin(내용·점수·베이지안) · SPF·DKIM·DMARC · <b>그레이리스팅</b>(처음 메일 임시 거부, 재전송만 수신) · 평판 <span class='done'>채팅에서 다룸</span>"],
[1, "PGP 메일 식별", "본문의 <b>ASCII Armor</b> 블록(Radix-64 = Base64) · <code>-----BEGIN PGP SIGNED MESSAGE-----</code> 서명만(본문 보임, 아래 <code>BEGIN PGP SIGNATURE</code>) = 인증·무결성·부인방지 · <code>-----BEGIN PGP MESSAGE-----</code> 암호화(본문 못 읽음) = 기밀성 · <code>-----BEGIN PGP PUBLIC KEY BLOCK-----</code> 공개키 · S/MIME은 첨부 <code>smime.p7s</code>(서명)·<code>smime.p7m</code>(암호화) <span class='done'>채팅에서 다룸</span>"],

function toc(){let h='<div class="toc"><a class="hot" href="#" data-t="ISMS-P · 관리체계">🧠 ISMS-P 101개 암기법 바로 가기<small>기·위·운·점 · 입사 스토리 12단계 · 수·보·제·파 + 권리</small></a>',last="",lg="";for(const[c,t,items]of D){if(c!==last){h+=`<h3>${C[c]}</h3>`;last=c;lg=""}if(GR[t]!==lg){h+=`<div class="tgrp">${GR[t]}</div>`;lg=GR[t]}const g=items.filter(x=>x[3]==="단"||x[3]==="서").length;h+=`<a href="#${sid(t)}" data-t="${t}"><span>${NUM[t]} ${t}</span><small>${items.length}${g?" · 기출 "+g:""}</small></a>`}return h+"</div>"}
function render(){if(cat==="toc"&&!q&&!onlyStar&&!onlyAtk&&!onlyGc){out.innerHTML=toc();return}let h="",n=0;for(const[c,t,items]of D){if(cat!=="all"&&cat!=="toc"&&c!==cat)continue;const f=items.filter(([s,k,d,g])=>(!onlyStar||s)&&(!onlyAtk||M[k])&&(!onlyGc||g==="단"||g==="서")&&(!q||strip(k+" "+d+" "+t+" "+(M[k]||"")).includes(q)));if(!f.length)continue;n+=f.length;h+=`<section id="${sid(t)}"><h2>${NUM[t]} ${t}<small>${GR[t]} · ${f.length}</small></h2>`+f.map(([s,k,d,g])=>`<div class="it"><div class="k">${s?'<span class="s">★</span>':""}${k}${g?`<span class="tag t${g}">${TG[g]}</span>`:""}</div><div class="d">${d}</div>${M[k]?`<button class="mb">🛡 방어 방법</button><div class="m" hidden>${M[k]}</div>`:""}</div>`).join("")+"</section>"}out.innerHTML=h||'<div class="empty">결과 없음</div>'}
document.getElementById("q").oninput=e=>{q=e.target.value.trim().toLowerCase();render()};
const sb=document.getElementById("star");sb.onclick=()=>{onlyStar=!onlyStar;sb.classList.toggle("on",onlyStar);render()};
const ab=document.getElementById("atk");ab.onclick=()=>{onlyAtk=!onlyAtk;ab.classList.toggle("on",onlyAtk);render()};
const gb=document.getElementById("gc");gb.onclick=()=>{onlyGc=!onlyGc;gb.classList.toggle("on",onlyGc);render()};
const qb=document.getElementById("quiz");qb.onclick=()=>{document.body.classList.toggle("quiz");qb.classList.toggle("on")};
out.addEventListener("click",e=>{const a=e.target.closest(".toc a");if(a){e.preventDefault();setTab("all");render();document.getElementById(sid(a.dataset.t)).scrollIntoView();return}const b=e.target.closest(".mb");if(b){const m=b.nextElementSibling;m.hidden=!m.hidden;b.classList.toggle("on",!m.hidden);return}const d=e.target.closest(".d");if(d&&document.body.classList.contains("quiz"))d.classList.toggle("show")});
render();
(function(){const el=document.getElementById("dday"),T=new Date("2026-11-14T09:00:00+09:00").getTime();function tick(){const r=T-Date.now();if(r<=0){el.hidden=true;clearInterval(t);return}const m=Math.floor(r/60000),d=Math.floor(m/1440),h=Math.floor(m%1440/60),mi=m%60;el.textContent=`⏰ 11월 14일 9시까지 ${d}일 ${h}시간 ${mi}분`;el.hidden=false}const t=setInterval(tick,20000);tick()})();
</script>
